name: Release manifest

# The Tabularium registry resolves a release by scanning its published assets
# for a file literally named `.tabularium` — it does not unzip the platform
# archives. The manual release zips already bundle the manifest (see the
# "Release Packaging" section in the README), but the registry also needs it as
# a standalone asset; otherwise it falls back to the unsigned repo-root path
# (no signed integrity / per-asset SHA-256). This runs on the release tag and
# attaches `.tabularium` to whichever release that tag points at.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  manifest:
    name: Attach .tabularium manifest asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload .tabularium to the release
        uses: softprops/action-gh-release@v2
        with:
          files: .tabularium
          fail_on_unmatched_files: true
